# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:
    inputs:
      use_self_hosted:
        description: 'Use self-hosted runners'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    # Use self-hosted runners if available and requested, otherwise use GitHub-hosted
    # To use self-hosted runners, set up runners with labels: [self-hosted, ethereum-org, nodejs]
    # See docs/self-hosted-runners.md for setup instructions
    runs-on: ${{ github.event.inputs.use_self_hosted == 'true' && fromJSON('["self-hosted", "ethereum-org", "nodejs"]') || 'ubuntu-latest' }}

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
    - run: pnpm run build --if-present
    - run: pnpm test
